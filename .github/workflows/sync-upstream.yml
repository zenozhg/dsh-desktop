name: Sync Upstream

on:
  schedule:
    # 每天 UTC 0:00 与 12:00（北京时间 8:00 与 20:00）自动运行
    - cron: '0 0,12 * * *'
  workflow_dispatch:
    inputs:
      trigger_build:
        description: '同步完成后是否触发 Windows ARM64 编译'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync Upstream & Tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add & Fetch Upstream
        run: |
          git remote add upstream https://github.com/dataelement/dsh-desktop.git
          git fetch upstream main --tags

      - name: Merge Upstream Main
        id: merge_step
        run: |
          git checkout -B main origin/main
          UPSTREAM_HEAD=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base upstream/main HEAD)
          echo "Upstream HEAD: $UPSTREAM_HEAD"
          echo "Merge base:    $MERGE_BASE"

          if [ "$UPSTREAM_HEAD" = "$MERGE_BASE" ]; then
            echo "Already up to date with upstream main."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits detected on upstream main. Merging..."
            if git merge upstream/main -m "chore: sync upstream changes"; then
              echo "Merge successful."
              git push origin HEAD:refs/heads/main
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Merge conflict encountered while syncing upstream!"
              exit 1
            fi
          fi

      - name: Push Upstream Tags
        id: tags_step
        run: |
          # 同步上游的所有 Tag（如 v0.9.1 等）
          TAG_OUTPUT=$(git push origin 'refs/tags/*:refs/tags/*' 2>&1 || true)
          echo "$TAG_OUTPUT"
          if echo "$TAG_OUTPUT" | grep -E "new tag|new ref"; then
            echo "new_tags=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_tags=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger ARM64 Build Workflow
        if: ${{ inputs.trigger_build || steps.merge_step.outputs.has_changes == 'true' || steps.tags_step.outputs.new_tags == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering Windows ARM64 build workflow..."
          gh workflow run build-windows-arm64.yml --ref main || echo "Trigger dispatched or pending."
